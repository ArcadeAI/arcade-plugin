name: Sync omnimcp releases

# Opens a draft PR in arcadeai-labs/omnimcp that makes its tree match a stable
# release of this repository. A person reviews and merges it.
on:
  workflow_call:
    inputs:
      source_tag:
        required: true
        type: string
    secrets:
      # The App needs Workflows write because the sync PR replaces omnimcp's check.yml.
      OMNIMCP_SYNC_APP_CLIENT_ID:
        description: Client ID of the GitHub App installed on arcadeai-labs/omnimcp with Contents, Pull requests, and Workflows write access
        required: true
      OMNIMCP_SYNC_APP_PRIVATE_KEY:
        description: Private key of that GitHub App
        required: true
  workflow_dispatch:
    inputs:
      source_tag:
        description: Stable release tag to sync, like v0.8.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-omnimcp-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.source_tag }}
          path: source
          persist-credentials: false

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: omnimcp-token
        with:
          client-id: ${{ secrets.OMNIMCP_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OMNIMCP_SYNC_APP_PRIVATE_KEY }}
          owner: arcadeai-labs
          repositories: omnimcp
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: arcadeai-labs/omnimcp
          token: ${{ steps.omnimcp-token.outputs.token }}
          path: dest

      - name: Check the release can be synced
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          release="$(jq -r .version source/plugin.json)"
          if ! [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$SOURCE_TAG" != "v${release}" ]; then
            echo "::error::${SOURCE_TAG} is not a stable release tag for plugin.json version ${release}"
            exit 1
          fi

          # omnimcp has published versions of its own, so a release from this
          # repository must be newer than the version omnimcp already lists.
          current="$(jq -r .version dest/plugin.json)"
          highest="$(printf '%s\n%s\n' "$current" "$release" | sort -V | tail -n 1)"
          if [ "$release" = "$current" ] || [ "$highest" != "$release" ]; then
            echo "::error::omnimcp is at ${current}; refusing to sync ${release}"
            exit 1
          fi

          # create-pull-request would force-push over commits a reviewer added
          # to this branch, and would open a new PR for a sync someone closed.
          # ls-remote exits 2 when the branch is missing and 128 when it can't
          # reach omnimcp, so only 2 means it is safe to continue.
          status=0
          git -C dest ls-remote --exit-code --heads origin "sync/release-${SOURCE_TAG}" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::omnimcp already has sync/release-${SOURCE_TAG}; delete that branch to sync this release again"
            exit 1
          fi
          if [ "$status" -ne 2 ]; then
            echo "::error::could not check omnimcp for sync/release-${SOURCE_TAG} (git ls-remote exited ${status})"
            exit 1
          fi

      # Keep destination workflows except the known obsolete mirror validator.
      - name: Copy the release tree into omnimcp
        id: copy
        run: |
          bash source/dev/scripts/sync-omnimcp-tree.sh source dest
          echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: dest
          token: ${{ steps.omnimcp-token.outputs.token }}
          branch: sync/release-${{ inputs.source_tag }}
          draft: true
          title: "sync: mirror ${{ inputs.source_tag }}"
          commit-message: |
            sync: mirror ${{ inputs.source_tag }}

            Source: ArcadeAI/arcade-plugin@${{ steps.copy.outputs.sha }}
          body: |
            Makes this tree match [ArcadeAI/arcade-plugin ${{ inputs.source_tag }}](https://github.com/ArcadeAI/arcade-plugin/releases/tag/${{ inputs.source_tag }}) (commit ${{ steps.copy.outputs.sha }}).

            Opened by the arcade-plugin release workflow. Review and merge by hand.
