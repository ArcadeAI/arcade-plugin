name: Sync omnimcp releases

# Opens a draft PR in arcadeai-labs/omnimcp that makes its tree match a stable
# release of this repository. A person reviews and merges it.
on:
  workflow_call:
    inputs:
      source_tag:
        required: true
        type: string
    secrets:
      OMNIMCP_SYNC_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      source_tag:
        description: Stable release tag to sync, like v0.8.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-omnimcp-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.source_tag }}
          path: source
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: arcadeai-labs/omnimcp
          token: ${{ secrets.OMNIMCP_SYNC_TOKEN }}
          path: dest

      # omnimcp has published versions of its own, so a release from this
      # repository must be newer than the version omnimcp already lists.
      - name: Refuse to lower omnimcp's version
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          release="${SOURCE_TAG#v}"
          current="$(jq -r .version dest/plugin.json)"
          highest="$(printf '%s\n%s\n' "$current" "$release" | sort -V | tail -n 1)"
          if [ "$release" = "$current" ] || [ "$highest" != "$release" ]; then
            echo "::error::omnimcp is at ${current}; refusing to sync ${release}"
            exit 1
          fi

      # omnimcp keeps its own workflows and its docs/migration/ notice.
      - name: Copy the release tree into omnimcp
        id: copy
        run: |
          rsync -a --delete \
            --exclude=/.git \
            --exclude=/.github/workflows/ \
            --exclude=/docs/migration/ \
            source/ dest/
          echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: dest
          token: ${{ secrets.OMNIMCP_SYNC_TOKEN }}
          branch: sync/release-${{ inputs.source_tag }}
          draft: true
          title: "sync: mirror ${{ inputs.source_tag }}"
          commit-message: |
            sync: mirror ${{ inputs.source_tag }}

            Source: ArcadeAI/arcade-plugin@${{ steps.copy.outputs.sha }}
          body: |
            Makes this tree match [ArcadeAI/arcade-plugin ${{ inputs.source_tag }}](https://github.com/ArcadeAI/arcade-plugin/releases/tag/${{ inputs.source_tag }}) (commit ${{ steps.copy.outputs.sha }}).

            Opened by the arcade-plugin release workflow. Review and merge by hand.
