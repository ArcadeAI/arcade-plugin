name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Structural checks
        run: node scripts/check.mjs

      - name: Agent Plugins schema validation
        run: npm run validate:schemas

      - name: Hook and manifest tests
        run: npm test

      - name: Agent Plugins discovery smoke test
        run: npm run verify:discover

      - name: Claude plugin validation
        run: npm run verify:claude

  # ── Merge gate: single pass/fail for branch protection ──
  # The branch ruleset only requires this one check. New CI jobs are added
  # to `needs:` here; the ruleset never changes.
  merge-ready:
    name: Merge ready
    needs:
      - check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
