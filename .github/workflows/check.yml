name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Structural checks
        run: node scripts/check.mjs

      - name: Agent Plugins schema validation
        run: npm run validate:schemas

      - name: Hook and manifest tests
        run: npm test

      - name: Agent Plugins discovery smoke test
        run: npm run verify:discover

      - name: Claude plugin validation
        run: npm run verify:claude

  complete:
    runs-on: ubuntu-latest
    if: always()
    needs: [check]
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed"
