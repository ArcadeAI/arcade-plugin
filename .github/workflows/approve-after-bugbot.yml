name: approve after Bugbot

# After the check workflow passes on a pull request from a branch in this
# repository, approve it if its author is a person with write access and Cursor
# Bugbot reviewed its latest commit with no findings. workflow_run always uses
# this file from main and checks out main, so a pull request can't change these
# rules for itself, and its code never runs here.
#
# The approval comes from a dedicated GitHub App, not GITHUB_TOKEN. Its ID and
# private key live in the pr-approver environment, which only main can use.
on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  approve:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/check.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pr-approver
    concurrency:
      group: approve-after-bugbot-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: dev/package.json

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: approver-token
        with:
          app-id: ${{ vars.APPROVER_APP_ID }}
          private-key: ${{ secrets.APPROVER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Approve if the author is internal and Bugbot passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVER_TOKEN: ${{ steps.approver-token.outputs.token }}
          APPROVER_LOGIN: ${{ steps.approver-token.outputs.app-slug }}[bot]
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node dev/scripts/approve-after-bugbot.mjs
