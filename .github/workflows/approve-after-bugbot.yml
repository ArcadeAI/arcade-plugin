name: approve after Bugbot

# After the check workflow passes on a pull request from a branch in this
# repository, approve it if its author is a person with write access and Cursor
# Bugbot reviewed its latest commit with no findings. workflow_run always uses
# this file from main and checks out main, so a pull request can't change these
# rules for itself, and its code never runs here.
on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  approve:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: approve-after-bugbot-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: dev/package.json

      - name: Approve if the author is internal and Bugbot passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node dev/scripts/approve-after-bugbot.mjs
