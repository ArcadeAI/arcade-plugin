name: release

# Tag-driven releases attach the Claude Desktop .mcpb to GitHub Releases.
# Built artifacts are never committed — see scripts/check.mjs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Verify tag matches VERSION
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION != VERSION file $FILE_VERSION"
            exit 1
          fi

      - name: Install dev dependencies
        run: npm ci

      - name: Structural checks
        run: node scripts/check.mjs

      - name: Full verify
        run: npm run validate:schemas && npm test && npm run verify:discover && npm run verify:claude

      - name: Build Claude Desktop extension
        run: node scripts/build-claude-desktop-mcpb.mjs

      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          gh release create "${GITHUB_REF_NAME}" \
            --title "Arcade ${GITHUB_REF_NAME}" \
            --notes "$(cat <<EOF
          - Endpoint: \`https://api.bosslevel.dev/mcp/all-optimized\`
          - Install (most agents): \`npx plugins add ArcadeAI/arcade-plugin\`
          - Claude Desktop: download \`arcade.mcpb\` below
          EOF
          )" \
            clients/claude-desktop/arcade.mcpb
