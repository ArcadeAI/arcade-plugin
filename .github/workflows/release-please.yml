name: Release Please

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions: {}

jobs:
  # Opens and labels release pull requests with the pr-approver GitHub App, so
  # this doesn't need "Allow GitHub Actions to create and approve pull
  # requests". Its ID and private key live in the pr-approver environment,
  # which only main can use.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pr-approver
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.APPROVER_APP_ID }}
          private-key: ${{ secrets.APPROVER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The ChatGPT upload ZIP is built and attached to the new release here.
  chatgpt-zip:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: dev/package.json
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Install dev dependencies
        run: npm ci
        working-directory: dev

      - name: Build the ChatGPT plugin ZIP
        run: npm run package:chatgpt
        working-directory: dev

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" dist/arcade-chatgpt-*.zip --clobber --repo "${GITHUB_REPOSITORY}"

  omnimcp-release-sync:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/sync-omnimcp.yml
    with:
      source_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      OMNIMCP_SYNC_APP_CLIENT_ID: ${{ secrets.OMNIMCP_SYNC_APP_CLIENT_ID }}
      OMNIMCP_SYNC_APP_PRIVATE_KEY: ${{ secrets.OMNIMCP_SYNC_APP_PRIVATE_KEY }}
