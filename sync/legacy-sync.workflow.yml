# INERT. Activation separately requires moving this template into
# .github/workflows/ and configuring LEGACY_SYNC_TOKEN.
name: sync-legacy

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: sync-legacy-omnimcp
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ArcadeAI/arcade-plugin' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: dev/package.json
      - name: Propose a legacy snapshot of the published release
        run: node dev/scripts/sync-legacy.mjs --apply
        env:
          SYNC_LEGACY_APPLY: "1"
          LEGACY_SYNC_TOKEN: ${{ secrets.LEGACY_SYNC_TOKEN }}
