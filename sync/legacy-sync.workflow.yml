# INERT. This file is not installed as a GitHub Actions workflow.
# Activation requires a separate approval to move it to
# .github/workflows/sync-legacy.yml and to provide LEGACY_SYNC_TOKEN.
# Do not add pull_request or a branch other than main. The script also
# refuses to write unless the event is a push to refs/heads/main.
name: sync-legacy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sync-legacy-omnimcp
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ArcadeAI/arcade-plugin' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json

      - name: Mirror canonical main onto the legacy sync pull request
        run: node scripts/sync-legacy.mjs --apply
        env:
          SYNC_LEGACY_APPLY: "1"
          LEGACY_SYNC_TOKEN: ${{ secrets.LEGACY_SYNC_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
