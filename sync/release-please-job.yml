# INERT job fragment for the existing Release Please workflow's jobs map.
# Separately activate sync/legacy-sync.workflow.yml as
# .github/workflows/sync-legacy.yml and configure LEGACY_SYNC_TOKEN first.
# GITHUB_TOKEN-created releases do not trigger release:published workflows;
# this explicit reusable-workflow call handles those releases.
legacy-release-sync:
  needs: release-please
  if: needs.release-please.outputs.release_created == 'true' && github.ref == 'refs/heads/main'
  permissions:
    contents: read
  uses: ./.github/workflows/sync-legacy.yml
  with:
    source_tag: ${{ needs.release-please.outputs.tag_name }}
  secrets:
    LEGACY_SYNC_TOKEN: ${{ secrets.LEGACY_SYNC_TOKEN }}
